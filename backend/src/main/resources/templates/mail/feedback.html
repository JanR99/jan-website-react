<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <title>Neues Feedback</title>
    </head>
    <body style="font-family: sans-serif; font-size: 15px; line-height: 1.5; color: #222;">
        <p>Hallo Jan,</p>
        <p>es gibt neues Feedback:</p>
        <table>
            <tr><td>Von:</td><td th:text="${name} + ' (' + ${email} + ')'"></td></tr>
            <tr><td>Seite:</td><td th:text="${page}"></td></tr>
            <tr><td>Zeit:</td><td th:text="${time}"></td></tr>
        </table>
        <p style="white-space: pre-wrap;" th:text="${text}"></p>
        <p>Alles Feedback findest du unter /konto/feedback.</p>
    </body>
</html>
