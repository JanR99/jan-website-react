<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <title>Fehler im Backend</title>
    </head>
    <body style="font-family: sans-serif; font-size: 15px; line-height: 1.5; color: #222;">
        <p>Hallo Jan,</p>
        <p>im Backend ist ein unerwarteter Fehler aufgetreten:</p>
        <table>
            <tr><td>Zeit:</td><td th:text="${time}"></td></tr>
            <tr><td>Anfrage:</td><td th:text="${request}"></td></tr>
            <tr><td>Fehler:</td><td th:text="${error}"></td></tr>
        </table>
        <pre style="font-size: 12px;" th:text="${stackTrace}"></pre>
        <p th:if="${notMailed > 0}">Seit der letzten Fehler-Mail gab es noch <span th:text="${notMailed}"></span> weitere Fehler ohne Mail.</p>
        <p>Alles Weitere steht im Log von Cloud Run.</p>
    </body>
</html>
