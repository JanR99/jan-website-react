name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options:
          - both
          - frontend
          - backend
        default: both

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  frontend:
    needs: checks
    if: github.event_name == 'release' || inputs.target != 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # a second deploy waits for the running one instead of cutting it off halfway
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    permissions:
      # pushes the build to the gh-pages branch
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  backend:
    needs: checks
    if: github.event_name == 'release' || inputs.target != 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-backend
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Read frontend domain from CNAME
        run: echo "FRONTEND_URL=https://$(tr -d '[:space:]' < public/CNAME)" >> "$GITHUB_ENV"

      # stops the deploy if a secret the backend needs is missing, instead of starting it without
      - name: Check and write environment variables file
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          keys = ["BOOTSTRAP_ADMIN_EMAIL", "BOOTSTRAP_ADMIN_PASSWORD", "JWT_SECRET", "BREVO_API_KEY", "FRONTEND_URL"]
          # BREVO_API_KEY is optional: without it the backend only sends no mails
          required = ["BOOTSTRAP_ADMIN_EMAIL", "BOOTSTRAP_ADMIN_PASSWORD", "JWT_SECRET", "FRONTEND_URL"]
          problems = [f"{k} is not set" for k in required if not os.environ.get(k, "").strip()]
          jwt_secret = os.environ.get("JWT_SECRET", "").strip()
          if jwt_secret and len(jwt_secret.encode()) < 32:
              problems.append("JWT_SECRET must have at least 32 characters (e.g. openssl rand -base64 48)")
          if os.environ.get("FRONTEND_URL", "").strip() in ("", "https://"):
              problems.append("FRONTEND_URL is empty: public/CNAME has no domain")
          for problem in dict.fromkeys(problems):
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "env.yaml"), "w") as f:
              for k in keys:
                  f.write(f"{k}: {json.dumps(os.environ.get(k, ''))}\n")
          PY

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy jan-website-backend \
            --source=. \
            --region=europe-west1 \
            --allow-unauthenticated \
            --env-vars-file="$RUNNER_TEMP/env.yaml"

  smoke-test:
    needs: [frontend, backend]
    # runs when one of the two was skipped, but not when one failed
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Home page, recipes and travel folders answer with 200
        env:
          API: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          API="${API%/}"
          FRONTEND="https://$(tr -d '[:space:]' < public/CNAME)"
          for url in "$FRONTEND/" "$API/api/recipes/list" "$API/api/travel/folders/list"; do
            # a few tries, as a new Cloud Run revision can take a moment to start
            curl -sS -o /dev/null --fail --retry 5 --retry-delay 10 --retry-all-errors -w "%{http_code} $url\n" "$url"
          done
