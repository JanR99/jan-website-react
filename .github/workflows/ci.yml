name: Checks

on:
  push:
    branches:
      - '**'
  workflow_call:

permissions:
  contents: read

# a new push to a branch replaces its checks that are still running; called by the deploy, they always finish
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run coverage

      - name: Coverage badge
        run: node scripts/coverage-badge.mjs "frontend coverage" coverage/coverage-summary.json badges/frontend-coverage.svg

      # the badge for the README (see coverage-badges.yml) and the report to look at
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: |
            badges/frontend-coverage.svg
            coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-firestore-emulator

      - name: Build and test
        run: mvn -B -pl backend -am verify

      - name: Coverage badge
        run: node scripts/coverage-badge.mjs "backend coverage" backend/target/site/jacoco/jacoco.csv badges/backend-coverage.svg

      # the badge for the README (see coverage-badges.yml) and the report to look at
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: |
            badges/backend-coverage.svg
            backend/target/site/jacoco/
          retention-days: 7
